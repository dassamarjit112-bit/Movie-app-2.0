  <!-- Anti-Ad Redirect System -->
  <script>
    (function() {
      let lastClickTime = 0;
      let legitNav = false;

      // Track clicks in capture phase to run before ad scripts
      document.addEventListener('click', function(e) {
        lastClickTime = Date.now();
        const a = e.target.closest('a');
        // Allow legitimate external links
        if (a && a.href && !a.href.startsWith(window.location.origin) && !a.href.startsWith('javascript:')) {
          legitNav = true;
          setTimeout(() => legitNav = false, 1500);
        }
      }, true);

      // Expose function for legitimate programmatic navigation (e.g., Google Auth)
      window.allowLegitNavigation = function() {
        legitNav = true;
        setTimeout(() => legitNav = false, 3000);
      };

      // Intercept ALL page unloads to stop aggressive auto-redirects
      window.addEventListener('beforeunload', function(e) {
        if (legitNav) return;
        
        // Always block unless it's a legitimate navigation
        e.preventDefault();
        e.returnValue = 'Ads are attempting to redirect you. Stay on this page?';
        return e.returnValue;
      });

      // Block <meta http-equiv="refresh"> redirects injected by ads
      const observer = new MutationObserver(mutations => {
        mutations.forEach(m => {
          m.addedNodes.forEach(node => {
            if (node.tagName === 'META' && node.httpEquiv && node.httpEquiv.toLowerCase() === 'refresh') {
              node.remove();
              console.warn('Blocked meta refresh ad redirect');
            }
          });
        });
      });
      document.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.documentElement, { childList: true, subtree: true });
      });
    })();
  </script>

  <script type="module">
    // ── Bootstrap Application ──
    (async function bootstrap() {
      // Force clear service workers and cache to ensure latest code is loaded
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
            console.log('Unregistered old service worker');
          }
          const cacheKeys = await caches.keys();
          for (const key of cacheKeys) {
            await caches.delete(key);
            console.log('Cleared cache:', key);
          }
        } catch(e) { console.error('Cache clear error', e); }
      }

      // Animate loader bar
      const fill = document.getElementById('loader-fill');
      if (fill) {
        setTimeout(() => fill.style.width = '75%', 100);
        setTimeout(() => fill.style.width = '100%', 800);
      }

      // Safety timeout: guarantee loading screen removal after 3 seconds max
      const removeLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('fadeout');
          setTimeout(() => loader.remove(), 600);
        }
      };
      const safetyTimer = setTimeout(() => {
        removeLoader();
        if (window.Router && !window.Router.initialized) {
          window.Router.initialized = true;
          window.Router.init();
        }
      }, 3000);

      try {
        // Wait for DOM + font load with a fallback timeout
        await Promise.race([
          document.fonts.ready,
          new Promise(r => setTimeout(r, 1000))
        ]);

        // Get session, handle rejections safely (max 2 seconds wait)
        if (window.sb && window.sb.auth) {
          await Promise.race([
            window.sb.auth.getSession(),
            new Promise((resolve) => setTimeout(resolve, 2000))
          ]).catch(err => console.warn('Auth check skipped:', err));
        }

        // Short min display time for branding
        await new Promise(r => setTimeout(r, 1000));

        // Success: remove loader
        clearTimeout(safetyTimer);
        removeLoader();

        // Initialize router
        if (window.Router && !window.Router.initialized) {
          window.Router.initialized = true;
          window.Router.init();
        } else if (!window.Router) {
          console.error('Router not loaded!');
        }

        // Handle auth state changes globally
        if (window.Auth && window.Auth.onAuthChange) {
          window.Auth.onAuthChange((session) => {
            if (session && window.UI) {
              UI.updateNavbarUser();
            }
          });
        }

        // Initialize notification system
        if (window.NotificationSystem) {
          window.NotificationSystem.init();
        }
      // Register Service Worker for Offline Capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }).catch(err => {
            console.warn('ServiceWorker registration failed: ', err);
          });
        });
      }

      } catch (err) {
        console.error('Bootstrap error occurred:', err);
        clearTimeout(safetyTimer);
        removeLoader();
        if (window.Router) window.Router.init();
      }
    })();
</script>
