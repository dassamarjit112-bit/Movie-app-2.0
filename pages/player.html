<!-- CineStream — Immersive HLS Video Player Page (Advanced) -->
<div id="player-page" style="background:#000; min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
  
  <!-- Full Screen Player Container -->
  <div id="player-container" style="position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000;">
    
    <!-- Video Element (for raw HLS/MP4 streams) -->
    <video id="hls-video" crossorigin="anonymous" style="width:100%; height:100%; object-fit:contain; cursor:pointer;" playsinline></video>

    <!-- Iframe Element (for third-party embed servers) -->
    <iframe id="iframe-video" style="width:100%; height:100%; border:none; display:none;" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>

    <!-- Gradient Overlay for UI readability -->
    <div class="player-gradient-overlay" style="position:absolute; inset:0; pointer-events:none; z-index:15; transition:opacity 0.3s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 30%, transparent 50%, rgba(0,0,0,0.6) 100%);
    "></div>

    <!-- Server Selector (top-right overlay) -->
    <div id="server-selector-overlay" style="position:absolute; top:16px; right:16px; z-index:35; display:none; transition:opacity 0.3s ease;">
      <button id="server-select-main-btn" style="background:rgba(20,20,24,0.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px 16px; color:#fff; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; box-shadow:0 8px 24px rgba(0,0,0,0.6); transition:all 0.2s;">
        <span class="material-symbols-outlined" style="font-size:18px; color:#00d084;">cloud_done</span>
        <span id="current-server-name">FilmU</span>
        <span class="material-symbols-outlined" style="font-size:14px; opacity:0.6;">expand_more</span>
      </button>
      <div id="server-dropdown-overlay" style="display:none; position:absolute; top:52px; right:0; background:rgba(15,15,20,0.98); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:8px; min-width:180px; box-shadow:0 16px 48px rgba(0,0,0,0.8); z-index:50;">
        <div style="font-size:10px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:0.08em; text-transform:uppercase; padding:6px 10px; margin-bottom:4px;">Available Servers</div>
        <div id="server-list-overlay"></div>
      </div>
    </div>

    <!-- UI Wake Catcher: intercepts clicks to wake up the UI when hidden -->
    <div id="ui-wake-catcher" style="position:absolute; inset:0; z-index:28; display:none; cursor:pointer;"></div>

    <!-- Buffer Spinner (advanced cinematic) -->
    <div id="buffer-spinner" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); z-index:20; pointer-events:none; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);">
      <div style="position:relative; width:100px; height:100px; display:flex; align-items:center; justify-content:center;">
        
        <!-- Outer rotating ring -->
        <div class="buffer-ring-outer" style="position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:rgba(229,9,20,0.9); border-right-color:rgba(229,9,20,0.3); animation:spin-outer 1.2s cubic-bezier(0.68, -0.15, 0.27, 1.15) infinite; box-shadow: 0 0 20px rgba(229,9,20,0.3), inset 0 0 20px rgba(229,9,20,0.1);"></div>
        
        <!-- Middle rotating ring (reverse) -->
        <div class="buffer-ring-middle" style="position:absolute; inset:12px; border-radius:50%; border:2px solid transparent; border-bottom-color:rgba(20,209,255,0.8); border-left-color:rgba(20,209,255,0.2); animation:spin-middle 1.8s cubic-bezier(0.68, -0.15, 0.27, 1.15) infinite; box-shadow: 0 0 15px rgba(20,209,255,0.2);"></div>
        
        <!-- Inner rotating ring -->
        <div class="buffer-ring-inner" style="position:absolute; inset:24px; border-radius:50%; border:2px solid transparent; border-top-color:rgba(255,200,0,0.7); border-right-color:rgba(255,200,0,0.15); animation:spin-inner 0.9s cubic-bezier(0.68, -0.15, 0.27, 1.15) infinite; box-shadow: 0 0 12px rgba(255,200,0,0.2);"></div>
        
        <!-- Center pulsing core -->
        <div class="buffer-core" style="width:32px; height:32px; border-radius:50%; background:radial-gradient(circle, rgba(229,9,20,0.4) 0%, rgba(229,9,20,0.1) 60%, transparent 100%); animation:pulse-core 1.5s ease-in-out infinite; display:flex; align-items:center; justify-content:center;">
          <div style="width:12px; height:12px; border-radius:50%; background:rgba(229,9,20,0.9); box-shadow: 0 0 20px rgba(229,9,20,0.8), 0 0 40px rgba(229,9,20,0.4); animation:pulse-inner 1.5s ease-in-out infinite;"></div>
        </div>
        
        <!-- Orbit dots -->
        <div class="buffer-orbit-dot" style="position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:8px; height:8px; border-radius:50%; background:#fff; box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(229,9,20,0.6); animation:orbit-pulse 2s ease-in-out infinite;"></div>
      </div>
      
      <!-- Buffering text with typing effect -->
      <div style="position:absolute; bottom:calc(50% - 70px); text-align:center;">
        <div class="buffer-text" style="font-size:11px; font-weight:700; color:rgba(255,255,255,0.9); letter-spacing:0.2em; text-transform:uppercase; font-family:'Inter', system-ui, sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">Buffering</div>
        <div class="buffer-dots" style="display:flex; gap:4px; justify-content:center; margin-top:8px;">
          <span class="buffer-dot" style="width:4px; height:4px; border-radius:50%; background:rgba(229,9,20,0.8); animation:dot-bounce 1.4s ease-in-out infinite; box-shadow: 0 0 6px rgba(229,9,20,0.6);"></span>
          <span class="buffer-dot" style="width:4px; height:4px; border-radius:50%; background:rgba(20,209,255,0.8); animation:dot-bounce 1.4s ease-in-out 0.2s infinite; box-shadow: 0 0 6px rgba(20,209,255,0.6);"></span>
          <span class="buffer-dot" style="width:4px; height:4px; border-radius:50%; background:rgba(255,200,0,0.8); animation:dot-bounce 1.4s ease-in-out 0.4s infinite; box-shadow: 0 0 6px rgba(255,200,0,0.6);"></span>
        </div>
      </div>
    </div>

    <!-- Error Message Overlay -->
    <div id="player-error-msg" style="display:none; position:absolute; inset:0; background:rgba(10,10,10,0.95); z-index:25; color:var(--c-error, #ff4d4d); font-size:18px; font-weight:600; padding:40px; text-align:center; box-sizing:border-box; align-content:center; justify-content:center;">
    </div>

    <!-- Back Button overlay (top bar) -->
    <div class="player-top-bar" style="position:absolute; top:0; left:0; right:0; padding:24px 32px; background:linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%); z-index:30; display:flex; justify-content:space-between; align-items:center; transition:opacity 0.3s ease;">
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="btn btn-icon" onclick="PlayerPage.goBack()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); width:46px; height:46px;" title="Go Back">
          <span class="material-symbols-outlined" style="font-size:22px">arrow_back</span>
        </button>
        
        <!-- Media Info -->
        <div style="display:flex; flex-direction:column;">
          <span id="player-title" style="font-size:16px; font-weight:700; color:#fff; display:block; text-shadow:0 2px 4px rgba(0,0,0,0.8);"></span>
          <span id="player-subtitle" style="font-size:12px; color:rgba(255,255,255,0.5); font-weight:500;">Loading...</span>
        </div>
      </div>
    </div>

    <!-- HTML5 Native Controls Fallback indicator / Overlay Custom Controls -->
    <div class="player-controls" style="position:absolute; bottom:0; left:0; right:0; background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); padding:40px 32px 24px; z-index:30; display:flex; flex-direction:column; gap:16px; transition:opacity 0.3s ease, transform 0.3s ease;">
      
      <!-- Progress Bar (Seek) -->
      <div style="display:flex; align-items:center; gap:12px; width:100%;">
        <span id="current-time" style="font-size:12px; font-weight:600; color:rgba(255,255,255,0.7); min-width:40px;">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" style="flex:1; height:4px; background:rgba(255,255,255,0.16); border:none; border-radius:99px; outline:none; -webkit-appearance:none; cursor:pointer;">
        <span id="duration" style="font-size:12px; font-weight:600; color:rgba(255,255,255,0.7); min-width:40px;">0:00</span>
      </div>

      <!-- Control Bar Buttons -->
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        
        <!-- Left Side Controls -->
        <div style="display:flex; align-items:center; gap:20px;">
          <!-- Play / Pause -->
          <button class="btn-icon" id="play-btn" style="background:none; border:none; width:44px; height:44px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
            <span class="material-symbols-outlined icon-fill" style="font-size:32px; color:#fff;">play_arrow</span>
          </button>

          <!-- Back 10s -->
          <button class="btn-icon" onclick="document.getElementById('hls-video').currentTime -= 10" style="background:none; border:none; width:36px; height:36px;" title="Backward 10s">
            <span class="material-symbols-outlined" style="font-size:22px;">replay_10</span>
          </button>
          
          <!-- Forward 10s -->
          <button class="btn-icon" onclick="document.getElementById('hls-video').currentTime += 10" style="background:none; border:none; width:36px; height:36px;" title="Forward 10s">
            <span class="material-symbols-outlined" style="font-size:22px;">forward_10</span>
          </button>

          <!-- Previous / Next Episode (for TV series) -->
          <button class="btn-icon" id="prev-ep-btn" style="display:none; background:none; border:none; width:36px; height:36px;" title="Previous Episode">
            <span class="material-symbols-outlined" style="font-size:22px;">skip_previous</span>
          </button>
          <button class="btn-icon" id="next-ep-btn" style="display:none; background:none; border:none; width:36px; height:36px;" title="Next Episode">
            <span class="material-symbols-outlined" style="font-size:22px;">skip_next</span>
          </button>

          <!-- Mute & Volume Slider -->
          <div style="display:flex; align-items:center; gap:8px;" class="volume-container">
            <button class="btn-icon" id="mute-btn" style="background:none; border:none; width:36px; height:36px;" title="Mute/Unmute">
              <span class="material-symbols-outlined" style="font-size:22px; color:#fff;">volume_up</span>
            </button>
            <input type="range" id="volume-slider" min="0" max="100" value="80" style="width:72px; height:3px; background:rgba(255,255,255,0.25); border:none; border-radius:99px; outline:none; -webkit-appearance:none; cursor:pointer;">
          </div>
        </div>

        <!-- Right Side Controls -->
        <div style="display:flex; align-items:center; gap:16px; position:relative;">
          
          <!-- Subtitles toggle -->
          <button class="btn-icon" id="subtitles-btn" style="background:none; border:none; width:36px; height:36px;" title="Subtitles">
            <span class="material-symbols-outlined" style="font-size:22px; color:#fff;">subtitles</span>
          </button>

          <!-- Picture in Picture -->
          <button class="btn-icon" id="pip-btn" style="background:none; border:none; width:36px; height:36px;" title="Picture-in-Picture">
            <span class="material-symbols-outlined" style="font-size:22px; color:#fff;">picture_in_picture_alt</span>
          </button>

          <!-- Playback Speed -->
          <div style="position:relative;">
            <button class="btn" id="speed-btn" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); padding:6px 12px; font-size:12px; border-radius:6px;" title="Speed">
              1.0x
            </button>
            <div id="speed-menu" class="hidden glass" style="position:absolute; bottom:42px; right:0; border-radius:8px; width:80px; overflow:hidden; z-index:40; display:flex; flex-direction:column;">
              <div data-speed="0.5" class="speed-item">0.5x</div>
              <div data-speed="0.75" class="speed-item">0.75x</div>
              <div data-speed="1.0" class="speed-item active">Normal</div>
              <div data-speed="1.25" class="speed-item">1.25x</div>
              <div data-speed="1.5" class="speed-item">1.5x</div>
              <div data-speed="2.0" class="speed-item">2.0x</div>
            </div>
          </div>

          <!-- Video Quality selector -->
          <div style="position:relative;">
            <button class="btn" id="quality-btn" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); padding:6px 12px; font-size:12px; border-radius:6px;" title="Resolution Quality">
              Auto
            </button>
            <div id="quality-menu" class="hidden glass" style="position:absolute; bottom:42px; right:0; border-radius:8px; width:100px; max-height:220px; overflow-y:auto; overflow-x:hidden; z-index:40; display:flex; flex-direction:column;">
              <!-- Dynamic resolutions will be inserted -->
            </div>
          </div>

          <!-- Fullscreen toggle -->
          <button class="btn-icon" id="fullscreen-btn" style="background:none; border:none; width:36px; height:36px;" title="Fullscreen">
            <span class="material-symbols-outlined" style="font-size:22px; color:#fff;">fullscreen</span>
          </button>
        </div>

      </div>
    </div>

  </div>
</div>

<style>
  /* Custom slider track and thumb adjustments */
  #seek-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--c-secondary-container);
    box-shadow: 0 0 15px rgba(20,209,255,0.8), 0 0 30px rgba(20,209,255,0.4);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #seek-bar::-webkit-slider-thumb:hover {
    transform: scale(1.35);
    box-shadow: 0 0 20px rgba(20,209,255,1), 0 0 40px rgba(20,209,255,0.6);
  }
  #seek-bar::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--c-secondary-container);
    border: none;
    cursor: pointer;
  }
  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }
  #volume-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
  }
  
  /* Hiding standard classes dynamically on mouse out */
  .player-controls.hidden, .player-top-bar.hidden {
    opacity: 0 !important;
    pointer-events: none;
  }
  
  /* Speed and quality menu items */
  .speed-item, .quality-item {
    padding: 8px 12px;
    font-size: 12px;
    color: rgba(229,226,225,0.6);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-align: center;
    font-weight: 500;
  }
  .speed-item:hover, .quality-item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .speed-item.active, .quality-item.active {
    color: #14d1ff;
    background: rgba(20,209,255,0.1);
    font-weight: 700;
  }
  
  .glass {
    background: rgba(20,20,25,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  
  /* Toast styling */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 9999;
    border: 1px solid rgba(255,255,255,0.06);
    white-space: nowrap;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.hidden { opacity: 0; transform: translateX(-50%) translateY(10px); }
  
  /* Server health pulse animation */
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  
  /* Advanced buffer spinner animations */
  @keyframes spin-outer {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes spin-middle {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-360deg); }
  }
  @keyframes spin-inner {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes pulse-core {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  @keyframes pulse-inner {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(229,9,20,0.8), 0 0 40px rgba(229,9,20,0.4); }
    50% { transform: scale(1.2); box-shadow: 0 0 30px rgba(229,9,20,1), 0 0 60px rgba(229,9,20,0.6); }
  }
  @keyframes orbit-pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    50% { transform: translateX(-50%) scale(1.4); opacity: 1; }
  }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-8px); opacity: 1; }
  }
  
  /* Playback speed menu item */
  .speed-item { font-size: 11px; padding: 7px 12px; }
  .quality-item { font-size: 11px; padding: 7px 12px; }
  
  /* Scrollbar for quality menu */
  #quality-menu::-webkit-scrollbar { width: 3px; }
  #quality-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  #quality-menu::-webkit-scrollbar-track { background: transparent; }
</style>

<!-- Toast notification -->
<div id="toast" class="toast hidden"></div>
<script>
  // Toast helper
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    toast.classList.add('visible');
    setTimeout(() => { 
      toast.classList.remove('visible'); 
      toast.classList.add('hidden'); 
    }, 3000);
  }

  function lockLandscape() {
    // Lock screen orientation to landscape if supported
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {
        console.warn('Screen orientation lock failed or not supported');
      });
    }
    // Request fullscreen for the whole document
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {
        console.warn('Fullscreen request failed');
      });
    }
  }

  // Updated event listeners to enforce landscape fullscreen on play and fullscreen actions
  document.addEventListener('DOMContentLoaded', () => {
    const playBtn = document.getElementById('play-btn');
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        lockLandscape();
      });
    }
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', () => {
        lockLandscape();
      });
    }
    
    // Also auto-request fullscreen when video starts playing
    const video = document.getElementById('hls-video');
    if (video) {
      video.addEventListener('play', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      });
    }
  });
</script>
